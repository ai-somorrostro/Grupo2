services:
  influxdb:
    image: influxdb:latest
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: reto
      DOCKER_INFLUXDB_INIT_PASSWORD: retoinicial123
      DOCKER_INFLUXDB_INIT_ORG: orgsomorrostro
      DOCKER_INFLUXDB_INIT_BUCKET: bucketsomorrostro
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: tokensomorrostro123456789
    volumes:
      - ./datos/influxdb:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: reto
      GF_SECURITY_ADMIN_PASSWORD: retoinicial123
    volumes:
      - ./datos/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - influxdb

  mcp:
    image: grafana/mcp-grafana:latest
    container_name: mcp-grafana
    restart: unless-stopped
    command: ["-t", "streamable-http", "--allowed-hosts", "*"]
    ports:
      - "8000:8000"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: reto
      GRAFANA_PASSWORD: retoinicial123
      # esto por ahora pero hay que tokenizarlo
      # GRAFANA_SERVICE_ACCOUNT_TOKEN: <tu_token>
    depends_on:
      - grafana

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
    depends_on:
      - influxdb