services:
  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: reto
      DOCKER_INFLUXDB_INIT_PASSWORD: retoinicial123
      DOCKER_INFLUXDB_INIT_ORG: orgsomorrostro
      DOCKER_INFLUXDB_INIT_BUCKET: bucketsomorrostro
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: tokensomorrostro123456789
    volumes:
      - ./datos/influxdb:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "smtp.gmail.com:587" 
      GF_SMTP_USER: "alain.vallecillos06@somo.eus" #cambiar por gmail del alertado
      GF_SMTP_PASSWORD: "soly tvri dllv ejev" #cambiar por contraseña de google desde el gmail del alertado
      GF_SMTP_FROM_ADDRESS: "alain.vallecillos06@somo.eus" #cambiar por gmail del alertado
      GF_SECURITY_ADMIN_USER: reto
      GF_SECURITY_ADMIN_PASSWORD: retoinicial123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb

  mcp:
    image: grafana/mcp-grafana:2.0.2
    container_name: mcp-grafana
    restart: unless-stopped
    command: ["-t", "streamable-http", "--allowed-hosts", "*"]
    ports:
      - "8000:8000"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_USERNAME: reto
      GRAFANA_PASSWORD: retoinicial123
    depends_on:
      - grafana

  nodered:
    image: nodered/node-red:5.0.8
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - NODE_RED_CREDENTIAL_SECRET=retoinicial123
    volumes:
      - ./nodered:/data
    depends_on:
      - influxdb

volumes:
  grafana_data:

