services:
  influxdb-init:
    image: influxdb:2.9.1
    user: "0:0"
    restart: "no"
    volumes:
      - ./datos/influxdb:/var/lib/influxdb2
    command: ["sh", "-c", "mkdir -p /var/lib/influxdb2 && chown -R 1000:1000 /var/lib/influxdb2"]

  influxdb:
    image: influxdb:2.9.1
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: ${DOCKER_INFLUXDB_INIT_MODE:-setup}
      DOCKER_INFLUXDB_INIT_USERNAME: ${DOCKER_INFLUXDB_INIT_USERNAME:?Define DOCKER_INFLUXDB_INIT_USERNAME en .env}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${DOCKER_INFLUXDB_INIT_PASSWORD:?Define DOCKER_INFLUXDB_INIT_PASSWORD en .env}
      DOCKER_INFLUXDB_INIT_ORG: ${DOCKER_INFLUXDB_INIT_ORG:?Define DOCKER_INFLUXDB_INIT_ORG en .env}
      DOCKER_INFLUXDB_INIT_BUCKET: ${DOCKER_INFLUXDB_INIT_BUCKET:?Define DOCKER_INFLUXDB_INIT_BUCKET en .env}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN:?Define DOCKER_INFLUXDB_INIT_ADMIN_TOKEN en .env}
    volumes:
      - ./datos/influxdb:/var/lib/influxdb2
    user: "1000:1000"
    depends_on:
      influxdb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  grafana:
    image: grafana/grafana:13.2.4
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SMTP_ENABLED: "${GF_SMTP_ENABLED:-true}"
      GF_SMTP_HOST: "${GF_SMTP_HOST:-smtp.gmail.com:587}"
      GF_SMTP_USER: "${GF_SMTP_USER:-}"
      GF_SMTP_PASSWORD: "${GF_SMTP_PASSWORD:-}"
      GF_SMTP_FROM_ADDRESS: "${GF_SMTP_FROM_ADDRESS:-}"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:?Define GF_SECURITY_ADMIN_USER en .env}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?Define GF_SECURITY_ADMIN_PASSWORD en .env}"
      DOCKER_INFLUXDB_INIT_ORG: "${DOCKER_INFLUXDB_INIT_ORG}"
      DOCKER_INFLUXDB_INIT_BUCKET: "${DOCKER_INFLUXDB_INIT_BUCKET}"
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: "${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    image: grafana/mcp-grafana:2.0.2
    container_name: mcp-grafana
    restart: unless-stopped
    command: ["-t", "streamable-http", "--allowed-hosts", "*"]
    ports:
      - "8000:8000"
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      GRAFANA_USERNAME: ${GF_SECURITY_ADMIN_USER}
      GRAFANA_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
    depends_on:
      grafana:
        condition: service_healthy

  nodered:
    build:
      context: ./nodered
      dockerfile: Dockerfile
    image: nodered-custom:5.0.8
    container_name: nodered
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET:?Define NODE_RED_CREDENTIAL_SECRET en .env}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG:?Define DOCKER_INFLUXDB_INIT_ORG en .env}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET:?Define DOCKER_INFLUXDB_INIT_BUCKET en .env}
    volumes:
      - ./nodered:/data
      - /data/node_modules
    depends_on:
      influxdb:
        condition: service_healthy

volumes:
  grafana_data:

